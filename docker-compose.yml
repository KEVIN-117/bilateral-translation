version: '3.8'

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: bilateral_translation_api
    restart: unless-stopped
    env_file:
      - ./api/.env
    environment:
      - 
    ports:
      - '8000:8000'

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: bilateral_translation_client
    restart: unless-stopped
    depends_on:
      - api
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_STRAPI_URL=http://api:1337
    ports:
      - '3000:3000'
